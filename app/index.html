<!doctype html>
<!-- Home+ Service: this hidden package only carries com.atvlauncher.app.service and
     the boot script. If it's ever opened, it hands over to Home+ (native). -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:100%;height:100%;background:#000}</style></head><body><script>
function open() {
  new PalmServiceBridge().call('luna://com.webos.applicationManager/launch', JSON.stringify({ id: 'com.atvlauncher.native' }));
}
open();
document.addEventListener('webOSRelaunch', open);
</script></body></html>
